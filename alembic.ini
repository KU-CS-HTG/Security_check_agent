[alembic]
script_location = migrations
# The DB URL is built from .env in migrations/env.py (owner role); never put it here.
prepend_sys_path = src

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

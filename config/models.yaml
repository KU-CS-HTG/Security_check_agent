# Embedding / LLM providers. Default is LOCAL so query/embedding/extraction run without
# external network (air-gap assumption). Switching to an external API requires an explicit opt-in.
# llm: decided in ADR-0005 (Qwen2.5-7B-Instruct via Ollama). embedding: still open (Phase 4).
allow_external: false
embedding:
  provider: local            # local | api
  endpoint: http://localhost:11434   # local runtime (e.g. Ollama on WSL2/Windows, GPU: RTX 4070)
  model: null
llm:
  provider: local
  endpoint: http://localhost:11434
  model: qwen2.5:7b-instruct   # Ollama tag; confirm with `ollama list` after `ollama pull`
  temperature: 0.0
  max_attempts: 3          # extraction: tries per clause (validation errors are fed back)
  timeout_seconds: 300
  num_ctx: 8192

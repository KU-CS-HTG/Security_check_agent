# Non-secret runtime settings. Secrets live in .env.
http:                         # used only by the collection stage (needs external network)
  min_interval_seconds: { default: 2.0 }   # per-host gap; raised per source in sources.yaml
  timeout_seconds: 30
  max_retries: 4
  respect_robots_txt: true
  cache_dir: data/http_cache
  cache_ttl_seconds: 86400
  # Hosts that are an official bulk-data channel documented for programmatic use
  # (OSV data page: "gs://osv-vulnerabilities", https://storage.googleapis.com/osv-vulnerabilities/...).
  # Everything else is checked against robots.txt.
  robots_exempt_hosts: [storage.googleapis.com]
  max_download_mb: 2048
